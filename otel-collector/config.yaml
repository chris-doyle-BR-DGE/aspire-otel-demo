receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  resource:
    attributes:
      - key: collector.name
        value: aspire-otel-demo
        action: upsert

exporters:
  otlp/aspire:
    endpoint: aspire-dashboard:18889
    tls:
      insecure: true
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/aspire, debug]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/aspire, debug]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/aspire, debug]
